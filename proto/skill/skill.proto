syntax = "proto3";

package stratum.skill;

import "google/protobuf/struct.proto";

message CreateSkillRequest {
  // @binding: required
  string name = 1;
  // @binding: required
  string description = 2;
  // @binding: required
  string instructions = 3;
  // Editors grants additional members update rights, persisted with the skill.
  repeated string editors = 8;
}

message UpdateSkillRequest {
  string name = 1;
  string description = 2;
  string instructions = 3;
  // expectedContentHash is the optimistic-concurrency baseline taken from the
  // current active revision. A save whose baseline mismatches the current
  // active content hash is rejected (409), guarding concurrent edits.
  // @omitempty
  string expectedContentHash = 4;
}

message SkillWorkspaceResponse {
  repeated string editors = 1;
  SkillProductResponse skill = 2;
  // active is the currently effective revision (empty when a legacy
  // unpublished skill has not yet produced its first version).
  SkillRevisionResponse active = 3;
  // hasDraft 标记存在未发布草稿(skills.draft_revision_id 非空)。前端据此
  // 展示草稿提示条并开启发布入口。
  bool hasDraft = 4;
}

message SkillProductResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  string status = 4;
  // @omitempty
  string activeRevisionId = 5;
  // isSystem 标记系统内置 skill(builtin: 前缀)的资源属性，不参与权限/控制特判：
  // 编辑、白名单、删除与普通 skill 走同一套权限体系。
  bool isSystem = 7;
}

message SkillRevisionResponse {
  string id = 1;
  string skillId = 2;
  // @omitempty
  int32 revisionNo = 3;
  string status = 4;
  string name = 5;
  string description = 6;
  string instructions = 7;
  // @omitempty
  google.protobuf.Struct publishChecks = 9;
  // isCurrent marks the version the skill's active_revision_id points to
  // (only populated by the version-history listing).
  bool isCurrent = 10;
  string createdBy = 11;
  // @omitempty
  string createdAt = 12;
  // contentHash is the optimistic-concurrency baseline: clients echo it back
  // as UpdateSkillRequest.expectedContentHash so a concurrent save is rejected
  // with 409 instead of silently overwriting.
  // @omitempty
  string contentHash = 13;
  // createdByName is the display name of createdBy (display_name > github_login
  // > actor_id), resolved at the response boundary. Display-only: the frontend
  // version-history 操作者 column prefers it over the raw id.
  string createdByName = 14;
  // parentRevisionId 指向直父版本(首版为空,omitempty)。列表行已携带完整编辑面
  // 内容,「详情」Drawer 以直父整份内容为 before 基线现算字段前后值,无需单版接口。
  // @omitempty
  string parentRevisionId = 15;
}

message SkillRevisionsResponse {
  repeated SkillRevisionResponse revisions = 1;
}

message RollbackSkillRequest {
  // @binding: required
  string revisionId = 1;
}

message ErrorResponse {
  int32 code = 1;
  string message = 2;
}

// SaveSkillDraftRequest 保存或覆盖 skill 的草稿,不立即生效。
// expectedContentHash 为乐观并发基线,取当前生效版本 content_hash,失配返回 409。
message SaveSkillDraftRequest {
  string name = 1;
  string description = 2;
  string instructions = 3;
  // @omitempty
  string expectedContentHash = 4;
}

// PublishSkillDraftRequest 将草稿提升为新的生效版本(版本号分配、旧版降级、指针重指)。
message PublishSkillDraftRequest {
  // @omitempty
  string expectedContentHash = 1;
}
