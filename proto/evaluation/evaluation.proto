syntax = "proto3";

package stratum.evaluation;

import "google/protobuf/struct.proto";

message EvaluationResourceRef {
  // @binding: required,oneof=skill agent mcp knowledge
  string kind = 1;
  // @binding: required
  string resource_id = 2;
  // @binding: required
  string revision_id = 3;
}

// JudgeSpec configures LLM judge assertion for assertion_mode=judge cases.
// Both fields are optional: empty Model/Rubric fall back to platform
// parameters and the registered global rubric respectively. The spec is a
// fact recorded when the case enters the draft; UpdateDraftCaseRequest
// deliberately does not carry it, so editing a case never rewrites it.
message JudgeSpec {
  string model = 1;
  string rubric = 2;
}

// ToolSpec 是工具序列确定性过程断言（§6.5）：约束执行链路上工具调用的行为。
// 空字段不参与校验；max_calls = 0 表示不限制调用次数。
message ToolSpec {
  repeated string must_call = 1;
  repeated string must_not_call = 2;
  repeated string order = 3;
  int32 max_calls = 4; // 0 = 不限制
}

// StepJudge 是步骤级 LLM rubric（§6.5）：对工具序列逐步骤评分。criteria 为空时
// 回退平台默认步骤 rubric。
message StepJudge {
  string criteria = 1;
}

// EvalSessionScript 是会话剧本（spec 2026-09-04 §5.4 阶段 B）：把单轮 case 泛化为
// 多轮会话形态。Goal 描述被测任务终点；Turns 逐轮注入 user 消息。提供 session 的
// case 即会话剧本（执行走 SessionRunner，多轮、终态断言作用末轮）；缺省（nil）=
// 旧单轮 case。与单轮 input 互斥表达：按用例形态二选一，会话 case 不需要 input。
message EvalSessionScript {
  // @binding: required
  string goal = 1;
  // @binding: required,min=1,dive
  repeated SessionTurn turns = 2;
}

// SessionTurn 是会话剧本的一轮。user 是注入 agent 的消息（必填）；probe 是该轮
// 期望 / 探针锚点（逐轮 checkpoint，阶段 B 承载、S3 轨迹判据消费）；tool_spec 是该
// 轮工具序列过程断言（nil = 该轮不做确定性过程校验）。
message SessionTurn {
  // @binding: required
  string user = 1;
  string probe = 2;
  optional ToolSpec tool_spec = 3;
}

message EvaluationCaseRequest {
  string name = 1;
  // 单轮 case 的测试输入（query），由服务端按形态校验：session 缺省（单轮）时必填；
  // 会话剧本 case（提供 session）不需要 input，可省略。keep 语义：不再强制绑定
  // required，改为 service 层 validateCaseShape 决定——同一请求消息承载两种互斥形态。
  google.protobuf.Value input = 2;
  // @binding: required
  google.protobuf.Value expected_output = 3;
  // @binding: required,oneof=exact contains regex judge
  string assertion_mode = 4;
  optional bool enabled = 5; // 手写 *bool,json 无 omitempty
  // 仅 assertion_mode=judge 时生效；规则断言 case 忽略该字段。
  optional JudgeSpec judge_spec = 6;
  // 工具序列过程断言（§6.5）；nil 表示不做工具序列规则校验。
  optional ToolSpec tool_spec = 7;
  // 步骤级 LLM rubric（§6.5）；nil 表示不做步骤级 judge。
  optional StepJudge step_judge = 8;
  // 会话剧本（阶段 B §5.4）；nil = 旧单轮 case。提供时 case 走多轮会话执行语义，
  // expected_output/assertion_mode 作为末轮终态断言。编辑 draft case 时随全量替换。
  optional EvalSessionScript session = 9;
}

message CreateEvaluationSuiteRequest {
  // @binding: required,max=255
  string name = 1;
  // @binding: max=2048
  string description = 2;
  // @binding: required,oneof=skill agent mcp knowledge
  string resource_kind = 3;
  // @binding: required,min=1,dive
  repeated EvaluationCaseRequest cases = 4;
}

message EnqueueEvaluationRunRequest {
  // @binding: required
  EvaluationResourceRef resource = 1;
  // @binding: required
  string suite_revision_id = 2;
  // @binding: required,max=255
  string idempotency_key = 3;
  // 平台组历史版本覆盖（对照确认 run 重放）；空 = 现 IsCurrent 语义。
  map<string, int64> platform_seq_overrides = 4;
}

message EvaluationJobResponse {
  string job_id = 1;
  string status = 2;
  // @omitempty
  string error_message = 3;
  // @omitempty
  string result_id = 4;
}

message GenerateOptimizationRequest {
  // @binding: omitempty,max=255
  string idempotency_key = 1;
  // @binding: required
  EvaluationResourceRef baseline = 2;
  // @binding: required
  string suite_revision_id = 3;
  // @gotype: map[string][]any
  google.protobuf.Struct search_space = 4;
  // @binding: max=50,dive,max=2048
  repeated string failure_summaries = 5;
}

message CreateEvaluationExperimentRequest {
  // @binding: required
  EvaluationResourceRef stable = 1;
  // @binding: required
  EvaluationResourceRef canary = 2;
  // @binding: required
  string suite_revision_id = 3;
}

message EvaluationCommandRequest {
  // @binding: required,max=2048
  string reason = 1;
  // @binding: required,max=255
  string idempotency_key = 2;
  // @binding: required,min=1
  int64 expected_state_version = 3;
}

message RecordEvaluationFeedbackRequest {
  // @binding: required
  string trace_id = 1;
  // @binding: required,oneof=skill agent mcp knowledge
  string resource_kind = 2;
  // @binding: required
  string resource_id = 3;
  // @binding: min=0,max=1
  double score = 4;
  google.protobuf.Struct outcome = 5;
  // @binding: required,max=255
  string idempotency_key = 6;
  bool security_violation = 7;
}

// GenerateSuiteCasesRequest drives one case-generation pass: production
// samples are sampled and turned into eval cases in the suite's draft
// revision. Cases never publish automatically.
message GenerateSuiteCasesRequest {
  // @binding: required,oneof=negative_first balanced
  string sample_policy = 1;
  // @binding: max=50
  // max_cases is optional: 0 means the handler default of
  // constants.DefaultCaseSampleLimit, so the binding must not reject 0.
  int32 max_cases = 2;
}

// UpdateDraftCaseRequest approves (enabled=true), edits (full field
// replacement) or rejects (enabled=false) one draft case. assertion_mode
// accepts judge so a judge case can be edited (e.g. rename input) without
// its recorded judge_spec being rewritten: judge_spec is deliberately not
// carried here and stays immutable once the case entered the draft.
message UpdateDraftCaseRequest {
  // @binding: required,max=255
  string name = 1;
  // 语义同 EvaluationCaseRequest.input：单轮 case 必填（service 层校验），会话剧本
  // case 可省略。原 binding required 移除，避免会话形态的 case 更新必须带无意义 input。
  google.protobuf.Value input = 2;
  // @binding: required
  google.protobuf.Value expected_output = 3;
  // @binding: required,oneof=exact contains regex judge
  string assertion_mode = 4;
  optional bool enabled = 5;
  // 会话剧本（阶段 B §5.4）：随 draft case 编辑 full replacement——会话 case 的
  // session 可改、单轮可转会话、会话可清空回单轮（nil 写回 '{}'）。与 judge_spec /
  // tool_spec / step_judge 不同：后者是 case 入 draft 时的事实，编辑刻意不携带。
  optional EvalSessionScript session = 6;
}

// ReviewItemDecisionRequest 人工评审结论（spec §9 回写状态机）。
message ReviewItemDecisionRequest {
  // @binding: required,oneof=pass fail judge_misjudgment case_revision
  string verdict = 1;
  // @binding: required,max=2048
  string reason = 2;
}
