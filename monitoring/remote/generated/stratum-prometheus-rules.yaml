apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stratum-remote-rules
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
    - name: stratum-reaper
      rules:
        - alert: StratumReaperDown
          expr: (time() - reaper_last_cycle_timestamp_seconds) > 7200 and reaper_last_cycle_timestamp_seconds > 0
          for: 10m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: reaper
          annotations:
            summary: Guest reaper has not run for over two hours
            description: The guest reaper last cycle is more than 7200s ago (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#reaper-down

        - alert: StratumReaperDeleteErrors
          expr: increase(reaper_delete_errors_total[1h]) > 0
          for: 5m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: reaper
          annotations:
            summary: Guest reaper delete errors in the last hour
            description: The guest reaper recorded delete errors in the last hour (increase {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#reaper-delete-errors

        - alert: StratumReaperDeleteErrorsCritical
          expr: increase(reaper_delete_errors_total[4h]) > 20
          for: 15m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: reaper
          annotations:
            summary: Guest reaper delete errors are accumulating
            description: More than 20 guest reaper delete errors in four hours (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#reaper-delete-errors-critical

        - alert: StratumReaperCycleErrors
          expr: increase(reaper_cycles_total{outcome="error"}[1h]) >= 3
          for: 10m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: reaper
          annotations:
            summary: Guest reaper error cycles in the last hour
            description: The guest reaper recorded at least three error cycles in the last hour (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#reaper-cycle-errors

    - name: stratum-background
      rules:
        - alert: StratumComponentStale
          expr: (time() - component_last_cycle_timestamp_seconds{component=~"chat-cleanup|checkpoint-cleanup"}) > 172800
          for: 30m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: background
          annotations:
            summary: A background component has not cycled for 48 hours
            description: Component {{ $labels.component }} last cycled more than 172800s ago (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#component-stale

        - alert: StratumComponentErrorRate
          expr: increase(component_errors_total[1h]) > 5
          for: 10m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: background
          annotations:
            summary: Background component errors in the last hour
            description: Component {{ $labels.component }} phase {{ $labels.phase }} recorded errors in the last hour (increase {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#component-error-rate

    - name: stratum-panics
      rules:
        - alert: StratumGoroutinePanic
          expr: increase(goroutine_panics_total[10m]) > 0
          for: 5m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: panic
          annotations:
            summary: Recovered goroutine panic in the last ten minutes
            description: Component {{ $labels.component }} panicked in the last ten minutes (increase {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#goroutine-panic

        - alert: StratumGoroutinePanicCritical
          expr: increase(goroutine_panics_total[1h]) > 10
          for: 10m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: panic
          annotations:
            summary: Goroutine panic storm in the last hour
            description: More than ten recovered panics in the last hour (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#goroutine-panic-critical

    - name: stratum-workflow
      rules:
        - alert: StratumWorkflowRunErrors
          expr: increase(workflow_runs_total{status="error"}[10m]) > 0
          for: 5m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: workflow
          annotations:
            summary: Workflow run error in the last ten minutes
            description: Tenant {{ $labels.tenant_id }} had workflow run errors in the last ten minutes (increase {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#workflow-run-errors

        - alert: StratumWorkflowErrorRate
          expr: increase(workflow_runs_total{status="error"}[30m]) > 20
          for: 15m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: workflow
          annotations:
            summary: Workflow errors exceed 20 in thirty minutes
            description: Tenant {{ $labels.tenant_id }} accumulated more than 20 workflow errors in 30 minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#workflow-error-rate

    - name: stratum-mcp
      rules:
        - alert: StratumMCPClientErrors
          expr: increase(mcp_client_requests_total{status="error"}[10m]) > 3
          for: 10m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: mcp
          annotations:
            summary: MCP client errors in the last ten minutes
            description: Server {{ $labels.server_name }} operation {{ $labels.operation }} recorded errors (increase {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#mcp-client-errors

        - alert: StratumMCPClientReconnects
          expr: increase(mcp_client_reconnects_total[1h]) > 5
          for: 10m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: mcp
          annotations:
            summary: MCP client reconnects in the last hour
            description: Server {{ $labels.server_name }} reconnected frequently (increase {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#mcp-client-reconnects

    - name: stratum-auth
      rules:
        - alert: StratumAuthFailures
          expr: increase(auth_failures_total[10m]) > 5
          for: 10m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: auth
          annotations:
            summary: Auth failures in the last ten minutes
            description: Reason {{ $labels.reason }} recorded more than five failures in ten minutes (increase {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#auth-failures

    - name: stratum-knowledge
      rules:
        - alert: StratumKnowledgeIngestFailures
          expr: increase(knowledge_ingest_total{status=~"failed|error"}[30m]) > 3
          for: 10m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: knowledge
          annotations:
            summary: Knowledge ingest failures in the last thirty minutes
            description: Status {{ $labels.status }} recorded failures in the last 30 minutes (increase {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#knowledge-ingest-failures

        - alert: StratumKnowledgeEmbedUnavailable
          expr: increase(knowledge_embed_unavailable_total[15m]) > 0
          for: 10m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: knowledge
          annotations:
            summary: Knowledge embedding model unavailable
            description: Tenant {{ $labels.tenant }} has no usable embedding model for knowledge ingest/RAG (increase {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#knowledge-embed-unavailable

    - name: stratum-hermes
      rules:
        - alert: StratumHermesErrors
          expr: increase(hermes_events_processed_total{status=~"publish_error|handler_error|unmarshal_error"}[10m]) > 0
          for: 5m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: hermes
          annotations:
            summary: Hermes event processing errors in the last ten minutes
            description: Event {{ $labels.event_type }} status {{ $labels.status }} recorded errors (increase {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#hermes-errors

    - name: stratum-memory-pipeline
      rules:
        - alert: StratumMemoryPipelinePanics
          expr: increase(memory_pipeline_panics_total[10m]) > 0
          for: 5m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: memory
          annotations:
            summary: Memory pipeline panic in the last ten minutes
            description: Component {{ $labels.component }} panicked in the memory pipeline (increase {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#memory-pipeline-panics

        - alert: StratumMemoryDLQ
          expr: increase(memory_dlq_total[1h]) > 5
          for: 10m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: memory
          annotations:
            summary: Memory DLQ messages in the last hour
            description: Tenant {{ $labels.tenant_id }} stage {{ $labels.stage }} accumulated DLQ messages (increase {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#memory-dlq

        - alert: StratumMemoryDLQCritical
          expr: increase(memory_dlq_total[1h]) > 50
          for: 10m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: memory
          annotations:
            summary: Memory DLQ backlog is critical
            description: Tenant {{ $labels.tenant_id }} stage {{ $labels.stage }} accumulated more than 50 DLQ messages in an hour (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#memory-dlq-critical

        - alert: StratumMemoryEmbedUnavailable
          expr: increase(memory_embed_unavailable_total[15m]) > 0
          for: 10m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: memory
          annotations:
            summary: 租户无可用嵌入模型，记忆写入持续进入 DLQ
            description: Tenant {{ $labels.tenant_id }} has no configured embedding model; memory writes are being dead-lettered (increase {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#memory-embed-unavailable

    - name: stratum-memory-workers
      rules:
        - alert: StratumMemoryWorkerPanics
          expr: increase(memory_worker_panics_total[10m]) > 0
          for: 5m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: memory
          annotations:
            summary: Memory worker panic in the last ten minutes
            description: Worker {{ $labels.worker }} panicked in the last ten minutes (increase {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#memory-worker-panics

        - alert: StratumMemoryWorkerErrorRate
          expr: rate(memory_worker_messages_total{status="error"}[30m]) > 0.1
          for: 15m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: memory
          annotations:
            summary: Memory worker error rate exceeds ten percent
            description: Worker {{ $labels.worker }} tenant {{ $labels.tenant_id }} error rate is above 10% (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#memory-worker-error-rate

    - name: stratum-evaluation
      rules:
        - alert: StratumEvaluationJobErrors
          expr: increase(evaluation_jobs_total{status=~"error|list_error"}[10m]) > 3
          for: 10m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: evaluation
          annotations:
            summary: Evaluation job errors in the last ten minutes
            description: Status {{ $labels.status }} recorded more than three errors in ten minutes (increase {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#evaluation-job-errors

    - name: stratum-model
      rules:
        - alert: StratumModelUnhealthy
          expr: model_health{status="unhealthy"} == 1
          for: 5m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: llmgateway
          annotations:
            summary: 模型持续 unhealthy 超过 5 分钟
            description: Model {{ $labels.model }} has been unhealthy for over five minutes; the resolution chain skips it (fail-closed).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#model-unhealthy

        - alert: StratumRouteFallbackSurge
          expr: increase(route_fallback_total[15m]) > 10
          for: 5m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: llmgateway
          annotations:
            summary: 模型降级链回退频次异常升高
            description: More than 10 route fallbacks in the last fifteen minutes ({{ $labels.from_model }} -> {{ $labels.to_model }}, increase {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#route-fallback-surge

    # memory 模型参数强制化告警：必需模型参数（platform 层 7 个 memory.*_model）
    # 缺失/指向未启用模型时，运行期 fail-closed + 探针周期完备性上报。与流量无关，
    # 即使零流量也持续亮灯，直到运维补齐配置或关闭对应消费组件。
    - name: stratum-memory-model-config
      rules:
        - alert: StratumMemoryModelParamMissing
          expr: memory_model_config_health{state="missing"} == 1
          for: 10m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: memory
          annotations:
            summary: 必需 memory 模型参数未配置
            description: Memory 必需模型参数 {{ $labels.param }} 为空/未配置，运行期将 fail-closed。
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#memory-model-param-missing

        - alert: StratumMemoryModelParamDisabled
          expr: memory_model_config_health{state="disabled"} == 1
          for: 10m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: memory
          annotations:
            summary: 必需 memory 模型参数指向未启用模型
            description: Memory 必需模型参数 {{ $labels.param }} 配置的模型不在 enabled 目录，运行期将 fail-closed。
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#memory-model-param-disabled

        - alert: StratumMemoryModelConfigFailed
          expr: increase(memory_model_config_errors_total[15m]) > 0
          for: 10m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: memory
          annotations:
            summary: 记忆步骤因模型配置缺失 fail-closed
            description: Memory {{ $labels.stage }} 因 {{ $labels.param }} {{ $labels.state }} 失败 {{ $value }} 次。
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#memory-model-config-failed
    - name: stratum-availability
      rules:
        - alert: StratumPublicEndpointDown
          expr: absent(probe_success{service="stratum",environment="remote-test",target="stratum-public-health"}) * 0 or probe_success{service="stratum",environment="remote-test",target="stratum-public-health"} == 0
          for: 3m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: public-endpoint
          annotations:
            summary: Stratum public endpoint is unavailable
            description: The remote public health probe has failed for three minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/availability.md#public-endpoint-down

        - alert: StratumBackendUnavailable
          expr: absent(kube_deployment_status_replicas_ready{namespace="stratum",deployment="stratum"}) * 0 or kube_deployment_status_replicas_ready{namespace="stratum",deployment="stratum"} == 0
          for: 3m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: backend
          annotations:
            summary: Stratum backend has no ready replicas
            description: The backend deployment has had no ready replicas for three minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/availability.md#backend-unavailable

        - alert: StratumFrontendUnavailable
          expr: absent(kube_deployment_status_replicas_ready{namespace="stratum",deployment="stratum-frontend"}) * 0 or kube_deployment_status_replicas_ready{namespace="stratum",deployment="stratum-frontend"} == 0
          for: 3m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: frontend
          annotations:
            summary: Stratum frontend has no ready replicas
            description: The frontend deployment has had no ready replicas for three minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/availability.md#frontend-unavailable

        - alert: StratumTargetMissing
          expr: absent(up{namespace="stratum",service="stratum",endpoint="http"}) or up{namespace="stratum",service="stratum",endpoint="http"} == 0
          for: 10m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: backend
          annotations:
            summary: Stratum application target is missing
            description: The expected Stratum scrape target has been absent or down for ten minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/availability.md#target-missing

        - alert: StratumIngressBackendUnreachable
          expr: |
            sum(rate(traefik_service_requests_total{service="stratum-stratum@http",code=~"50[23]"}[5m]))
              /
            clamp_min(sum(rate(traefik_service_requests_total{service="stratum-stratum@http"}[5m])), 1)
            > 0.10
          for: 5m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: ingress
          annotations:
            summary: Traefik reports high 502/503 rate to backend
            description: More than 10% of requests from Traefik to the Stratum backend are returning 502 or 503 in the last five minutes (current value {{ $value }}). The backend pods may be crashing.
            dashboard_url: /d/stratum-http
            runbook_url: /docs/operations/alerts/availability.md#ingress-backend-unreachable
    - name: stratum-capacity
      rules:
        - alert: StratumNodeMemoryLow
          expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10) * on (instance) group_left (node) label_replace(node_uname_info{job="node-exporter"}, "node", "$1", "nodename", "(.+)") and on (node) max by (node) (kube_pod_info{namespace="stratum"})
          for: 15m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: node
          annotations:
            summary: Stratum host memory availability is low
            description: Available node memory has remained below 10% for fifteen minutes (current ratio {{ $value }}).
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/capacity.md#node-memory-low

        - alert: StratumNodeCPUHigh
          expr: (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85) * on (instance) group_left (node) label_replace(node_uname_info{job="node-exporter"}, "node", "$1", "nodename", "(.+)") and on (node) max by (node) (kube_pod_info{namespace="stratum"})
          for: 15m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: node
          annotations:
            summary: Stratum host CPU utilization is high
            description: Node CPU utilization has remained above 85% for fifteen minutes (current ratio {{ $value }}).
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/capacity.md#node-cpu-high

        - alert: StratumNodeFilesystemLow
          expr: (node_filesystem_avail_bytes{mountpoint=~"^/(data)?$",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint=~"^/(data)?$",fstype!~"tmpfs|overlay|squashfs"} < 0.15) * on (instance) group_left (node) label_replace(node_uname_info{job="node-exporter"}, "node", "$1", "nodename", "(.+)") and on (node) max by (node) (kube_pod_info{namespace="stratum"})
          for: 15m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: storage
          annotations:
            summary: Stratum host filesystem space is low
            description: Available filesystem space has remained below 15% for fifteen minutes (current ratio {{ $value }}).
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/capacity.md#node-filesystem-low

        - alert: StratumNodeInodesLow
          expr: (node_filesystem_files_free{mountpoint=~"^/(data)?$",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_files{mountpoint=~"^/(data)?$",fstype!~"tmpfs|overlay|squashfs"} < 0.15) * on (instance) group_left (node) label_replace(node_uname_info{job="node-exporter"}, "node", "$1", "nodename", "(.+)") and on (node) max by (node) (kube_pod_info{namespace="stratum"})
          for: 15m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: storage
          annotations:
            summary: Stratum host filesystem inodes are low
            description: Available filesystem inodes have remained below 15% for fifteen minutes (current ratio {{ $value }}).
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/capacity.md#node-inodes-low

        - alert: StratumContainerMemoryNearLimit
          expr: sum by (namespace, pod, container) (container_memory_working_set_bytes{namespace="stratum",container!="",container!="POD"}) / sum by (namespace, pod, container) (container_spec_memory_limit_bytes{namespace="stratum",container!="",container!="POD"}) > 0.90 and sum by (namespace, pod, container) (container_spec_memory_limit_bytes{namespace="stratum",container!="",container!="POD"}) > 0
          for: 15m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: workload
          annotations:
            summary: A Stratum container is near its memory limit
            description: Container working-set memory has remained above 90% of its limit for fifteen minutes (current ratio {{ $value }}).
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/capacity.md#container-memory-near-limit

        - alert: StratumContainerCPUThrottled
          expr: sum by (namespace, pod, container) (rate(container_cpu_cfs_throttled_periods_total{namespace="stratum",container!="",container!="POD"}[5m])) / sum by (namespace, pod, container) (rate(container_cpu_cfs_periods_total{namespace="stratum",container!="",container!="POD"}[5m])) > 0.25
          for: 15m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: workload
          annotations:
            summary: A Stratum container is CPU throttled
            description: More than 25% of container CPU periods have been throttled for fifteen minutes (current ratio {{ $value }}).
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/capacity.md#container-cpu-throttled

        - alert: StratumPVCUsageHigh
          expr: kubelet_volume_stats_used_bytes{namespace="stratum"} / kubelet_volume_stats_capacity_bytes{namespace="stratum"} > 0.80
          for: 15m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: storage
            alert_family: pvc-usage
          annotations:
            summary: A Stratum PVC is more than 80% full
            description: Persistent volume usage has remained above 80% for fifteen minutes (current ratio {{ $value }}).
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/capacity.md#pvc-usage-high

        - alert: StratumPVCUsageCritical
          expr: kubelet_volume_stats_used_bytes{namespace="stratum"} / kubelet_volume_stats_capacity_bytes{namespace="stratum"} > 0.90
          for: 5m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: storage
            alert_family: pvc-usage
          annotations:
            summary: A Stratum PVC is more than 90% full
            description: Persistent volume usage has remained above 90% for five minutes (current ratio {{ $value }}).
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/capacity.md#pvc-usage-critical

        - record: stratum:pvc_exhaustion_within_4d
          expr: ((predict_linear(kubelet_volume_stats_available_bytes{namespace="stratum"}[6h], 4 * 24 * 60 * 60) < bool 0) == 1) and on (namespace, persistentvolumeclaim) (deriv(kubelet_volume_stats_used_bytes{namespace="stratum"}[6h]) > 0) and on (namespace, persistentvolumeclaim) kubelet_volume_stats_available_bytes{namespace="stratum"} and on (namespace, persistentvolumeclaim) kubelet_volume_stats_available_bytes{namespace="stratum"} offset 6h and on (namespace, persistentvolumeclaim) kube_persistentvolumeclaim_info{storageclass!="local-path"}

        - record: stratum:pvc_exhaustion_within_1d
          expr: ((predict_linear(kubelet_volume_stats_available_bytes{namespace="stratum"}[6h], 24 * 60 * 60) < bool 0) == 1) and on (namespace, persistentvolumeclaim) (deriv(kubelet_volume_stats_used_bytes{namespace="stratum"}[6h]) > 0) and on (namespace, persistentvolumeclaim) kubelet_volume_stats_available_bytes{namespace="stratum"} and on (namespace, persistentvolumeclaim) kubelet_volume_stats_available_bytes{namespace="stratum"} offset 6h and on (namespace, persistentvolumeclaim) kube_persistentvolumeclaim_info{storageclass!="local-path"}

        - alert: StratumPVCExhaustionPredicted
          expr: stratum:pvc_exhaustion_within_4d == 1
          for: 15m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: storage
            alert_family: pvc-exhaustion
          annotations:
            summary: A Stratum PVC may fill within four days
            description: Six hours of positive storage growth predicts exhaustion within four days (current value {{ $value }}).
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/capacity.md#pvc-exhaustion-predicted

        - alert: StratumPVCExhaustionImminent
          expr: stratum:pvc_exhaustion_within_1d == 1
          for: 5m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: storage
            alert_family: pvc-exhaustion
          annotations:
            summary: A Stratum PVC may fill within one day
            description: Six hours of positive storage growth predicts exhaustion within one day (current value {{ $value }}).
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/capacity.md#pvc-exhaustion-imminent

        - record: stratum:filesystem_exhaustion_within_4d
          expr: (((predict_linear(node_filesystem_avail_bytes{mountpoint=~"^/(data)?$",fstype!~"tmpfs|overlay|squashfs"}[6h], 4 * 24 * 60 * 60) < bool 0) == 1) and on (instance, device, mountpoint, fstype) (deriv(node_filesystem_avail_bytes{mountpoint=~"^/(data)?$",fstype!~"tmpfs|overlay|squashfs"}[6h]) < 0) and on (instance, device, mountpoint, fstype) node_filesystem_avail_bytes{mountpoint=~"^/(data)?$",fstype!~"tmpfs|overlay|squashfs"} and on (instance, device, mountpoint, fstype) node_filesystem_avail_bytes{mountpoint=~"^/(data)?$",fstype!~"tmpfs|overlay|squashfs"} offset 6h) * on (instance) group_left (node) label_replace(node_uname_info{job="node-exporter"}, "node", "$1", "nodename", "(.+)") and on (node) max by (node) (kube_pod_info{namespace="stratum"})

        - record: stratum:filesystem_exhaustion_within_1d
          expr: (((predict_linear(node_filesystem_avail_bytes{mountpoint=~"^/(data)?$",fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 60 * 60) < bool 0) == 1) and on (instance, device, mountpoint, fstype) (deriv(node_filesystem_avail_bytes{mountpoint=~"^/(data)?$",fstype!~"tmpfs|overlay|squashfs"}[6h]) < 0) and on (instance, device, mountpoint, fstype) node_filesystem_avail_bytes{mountpoint=~"^/(data)?$",fstype!~"tmpfs|overlay|squashfs"} and on (instance, device, mountpoint, fstype) node_filesystem_avail_bytes{mountpoint=~"^/(data)?$",fstype!~"tmpfs|overlay|squashfs"} offset 6h) * on (instance) group_left (node) label_replace(node_uname_info{job="node-exporter"}, "node", "$1", "nodename", "(.+)") and on (node) max by (node) (kube_pod_info{namespace="stratum"})

        - alert: StratumFilesystemExhaustionPredicted
          expr: stratum:filesystem_exhaustion_within_4d == 1
          for: 15m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: storage
            alert_family: filesystem-exhaustion
          annotations:
            summary: A Stratum host filesystem may fill within four days
            description: Six hours of positive filesystem growth predicts exhaustion within four days (current value {{ $value }}).
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/capacity.md#filesystem-exhaustion-predicted

        - alert: StratumFilesystemExhaustionImminent
          expr: stratum:filesystem_exhaustion_within_1d == 1
          for: 5m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: storage
            alert_family: filesystem-exhaustion
          annotations:
            summary: A Stratum host filesystem may fill within one day
            description: Six hours of positive filesystem growth predicts exhaustion within one day (current value {{ $value }}).
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/capacity.md#filesystem-exhaustion-imminent
    - name: stratum-dependencies
      rules:
        - alert: StratumDependencyTargetMissing
          expr: label_replace((absent(up{namespace="stratum",service="stratum-etcd-metrics",endpoint="metrics"}) or up{namespace="stratum",service="stratum-etcd-metrics",endpoint="metrics"} == 0), "dependency", "etcd", "service", ".*") or label_replace((absent(up{namespace="stratum",service="stratum-milvus-metrics",endpoint="metrics"}) or up{namespace="stratum",service="stratum-milvus-metrics",endpoint="metrics"} == 0), "dependency", "milvus", "service", ".*")
          for: 10m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: dependency
          annotations:
            summary: A verified Stratum dependency metrics target is unavailable
            description: Prometheus has been unable to scrape the dependency metrics endpoint for ten minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-dependencies
            runbook_url: /docs/operations/alerts/dependencies.md#dependency-target-missing
    - name: stratum-evaluation-observability
      rules:
        - alert: StratumEvalBehaviorAnomaly
          expr: |
            rate(eval_behavior_anomaly_total[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
            service: evaluation
            component: runtime-observation
            environment: remote-test
          annotations:
            summary: 评测行为异常判异升高
            description: >-
              运行态观测行为异常判异速率 {{ $value | printf "%.2f" }}/s（signal 维度见
              labels），持续 5 分钟。检查判异来源（judge 跌阈 / 行为放弃 / 规则命中）并
              到评测中心下钻对应 trace。
            dashboard_url: https://stratum.grafana/d/evaluation
            runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-behavior-anomaly
        - alert: StratumEvalSampleCoverageLow
          expr: |
            eval_sample_coverage < 0.5
          for: 10m
          labels:
            severity: warning
            service: evaluation
            component: runtime-observation
            environment: remote-test
          annotations:
            summary: 评测主动采样覆盖率不足
            description: >-
              eval_sample_coverage（落库/采样候选）低于 0.5 持续 10 分钟，可能 judge
              整层故障降级、校验非法或落库失败导致观测静默丢失。核对 judge 可用性与
              落库链路，禁止静默跳过某层（§14）。judge 配置关闭属主动停观测，不计入分母。
            dashboard_url: https://stratum.grafana/d/evaluation
            runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-sample-coverage-low
        - alert: StratumEvalRuleBlocked
          expr: |
            rate(eval_rule_hit_total{verdict="block"}[5m]) > 0
          for: 5m
          labels:
            severity: critical
            service: evaluation
            component: runtime-observation
            environment: remote-test
          annotations:
            summary: 规则护栏命中拦截
            description: >-
              规则护栏即时拦截速率 > 0（rule={{ $labels.rule }}），持续 5 分钟。
              T4 红线级：按 runbook 立即人工确认并处置。
            dashboard_url: https://stratum.grafana/d/evaluation
            runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-rule-blocked
        - alert: StratumEvalRuleDisabled
          expr: |
            increase(eval_rule_hit_total{verdict="detected"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
            service: evaluation
            component: runtime-observation
            environment: remote-test
          annotations:
            summary: 规则护栏命中但未拦截
            description: >-
              检测到规则护栏命中但未拦截：evaluation.ruleguard.enabled=false 但 denylist 非空，
              命中 verdict=detected 持续 5 分钟。护栏当前只检测不拦截，命中工具照常执行。若该
              工具应禁用，请开启 evaluation.ruleguard.enabled；否则收紧 denylist 移除误报。
            dashboard_url: https://stratum.grafana/d/evaluation
            runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-rule-disabled
        - alert: StratumEvalJudgeDegraded
          # 事件计数阈值而非瞬时 rate>0：任一 30 分钟窗口内 judge_unavailable 累计 ≥ 3 次
          # 且持续 15 分钟才告警，隔离单次瞬时抖动。恢复后需等失败事件滚出窗口自动消除。
          expr: |
            increase(eval_judge_failure_total{reason="judge_unavailable"}[30m]) >= 3
          for: 15m
          labels:
            severity: warning
            service: evaluation
            component: judge
            environment: remote-test
          annotations:
            summary: judge 外部依赖持续不可用
            description: >-
              30 分钟内 judge_unavailable 失败累计 ≥ 3 次（事件计数阈值）并持续 15 分钟
              （§11.2 judge 健康）。judge 是异步外部依赖，需有超时预算、有限重试与熔断/隔离；
              核对 LLM provider 可用性、限额与配置，恢复后告警自动消除。
            dashboard_url: https://stratum.grafana/d/evaluation
            runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-judge-degraded
        - alert: StratumEvalQueueBacklogHigh
          # 只告警评测观测消费队列（observation），排除同指标下其它语义的队列。
          expr: |
            eval_queue_backlog{queue="observation"} > 1000
          for: 15m
          labels:
            severity: warning
            service: evaluation
            component: observation-consumer
            environment: remote-test
          annotations:
            summary: 评测观测队列积压超过阈值（当前 {{ $value }}）
            description: >-
              评测观测消费队列（queue=observation）积压持续 > 1000 达 15 分钟。消费
              停滞将延迟观测落库与采样覆盖统计，检查 observation consumer 健康状况。
            dashboard_url: https://stratum.grafana/d/evaluation
            runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-queue-backlog-high
        - alert: StratumEvalReviewBacklogHigh
          expr: |
            eval_review_backlog > 50
          for: 15m
          labels:
            severity: warning
            service: stratum-evaluation
            component: review-pool
            environment: production
          annotations:
            summary: "人工评审池积压超过阈值（当前 {{ $value }}）"
            description: "待评审条目持续 > 50 达 15 分钟，低置信/判异样本滞留，需人工介入。"
            dashboard_url: "{{ $externalURL }}"
            runbook_url: /docs/runbooks/stratum-eval-review-backlog.md#stratum-eval-review-backlog-high
        - alert: StratumEvalJudgeBelowThreshold
          expr: |
            increase(eval_gate_action_total{layer="detect",action="flag"}[15m]) > 0 OR (sum(rate(eval_judge_score_bucket{le="0.5"}[10m])) / clamp_min(sum(rate(eval_judge_score_count[10m])), 1)) > 0.3
          for: 10m
          labels:
            severity: warning
            service: evaluation
            component: runtime-observation
            environment: remote-test
          annotations:
            summary: judge 跌阈判定升高（低分尾部占比超阈值）
            description: >-
              judge 单维度低于 JudgeBelowThreshold 的判异升高：detect/flag 计数 15 分钟
              increase &gt; 0，或 eval_judge_score 直方图 &lt;0.5 尾部占比 &gt; 30%（10 分钟
              窗口）。第一腿信号现网即燃（applyAnomalyVerdict emit layer=detect action=flag）。
              到评测中心下钻对应 trace，人工确认真退化后走参数/版本调整。
            dashboard_url: https://stratum.grafana/d/evaluation
            runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-judge-below-threshold
        - alert: StratumEvalRunRegression
          expr: |
            increase(eval_gate_action_total{layer="l2",action="regression"}[15m]) > 0
          for: 10m
          labels:
            severity: warning
            service: evaluation
            component: runtime-observation
            environment: remote-test
          annotations:
            summary: run 级回归劣化判异
            description: >-
              run 级回归判异出现（layer=l2 action=regression，15 分钟 increase &gt; 0）。
              P2 该 label 值仅由发布哨兵判劣 emit（Task 5），T13 确认 run 复用；规则先落、当前
              只读待命。到评测中心对比 base vs current run 的 by_dimension 并人工确认。
            dashboard_url: https://stratum.grafana/d/evaluation
            runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-run-regression
        - alert: StratumEvalMultiTenantVerifyNotRecovered
          expr: |
            increase(eval_gate_action_total{layer="l3_multitenant_verify",action="not_recovered"}[30m]) >= 1
          for: 5m
          labels:
            severity: critical
            service: evaluation
            component: l3-plus-platform
            environment: remote-test
          annotations:
            summary: 平台回滚后多租户验证存在未恢复租户（当前 {{ $value }}）
            description: >-
              平台版本回滚后 multi-tenant verify 判定 ≥ 1 个租户 not_recovered（回滚后
              该租户表现仍劣于回滚前），持续 5 分钟。平台参数影响全租户，属 T4 红线级；
              按 runbook 立即人工确认并处置。
            dashboard_url: https://stratum.grafana/d/evaluation
            runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-multitenant-verify-not-recovered
        - alert: StratumEvalPlatformMultiTenantDivergence
          expr: |
            increase(eval_gate_action_total{layer="l3_multitenant_verify",action="not_recovered"}[30m]) > 0
              AND increase(eval_gate_action_total{layer="l3_multitenant_verify",action="recovered"}[30m]) > 0
          for: 10m
          labels:
            severity: warning
            service: evaluation
            component: l3-plus-platform
            environment: remote-test
          annotations:
            summary: 平台版本多租户验证出现分化（多数恢复 / 少数未恢复）
            description: >-
              同一平台版本窗口内 recovered 与 not_recovered 并存（多数改善少数劣化分布效应，
              spec §3.4-4 / §9.4.2）。仅信号告警不做自动处置；劣化租户名单供人工在归因视图下钻。
            dashboard_url: https://stratum.grafana/d/evaluation
            runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-platform-multitenant-divergence
    - name: stratum-http-recording
      interval: 1m
      rules:
        - record: stratum:http_requests:increase5m
          expr: sum(increase(http_requests_total{namespace="stratum",service="stratum",endpoint="http",path!~"^/(health|livez|readyz|metrics)$"}[5m]))
          labels:
            service: stratum
            environment: remote-test

        - record: stratum:http_5xx_ratio:ratio5m
          expr: sum(increase(http_requests_total{namespace="stratum",service="stratum",endpoint="http",path!~"^/(health|livez|readyz|metrics)$",status=~"5.."}[5m])) / clamp_min(sum(increase(http_requests_total{namespace="stratum",service="stratum",endpoint="http",path!~"^/(health|livez|readyz|metrics)$"}[5m])), 1)
          labels:
            service: stratum
            environment: remote-test

        - record: stratum:http_request_duration_seconds:p95_5m
          expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="stratum",service="stratum",endpoint="http",path!~"^/(health|livez|readyz|metrics)$"}[5m])))
          labels:
            service: stratum
            environment: remote-test

        - record: stratum:http_requests_by_path:increase5m
          expr: sum by (path) (increase(http_requests_total{namespace="stratum",service="stratum",endpoint="http",path!="unmatched",path!~"^/(health|livez|readyz|metrics)$",path!~".*/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}($|/).*"}[5m]))
          labels:
            service: stratum
            environment: remote-test

        - record: stratum:http_5xx_ratio_by_path:ratio5m
          expr: sum by (path) (increase(http_requests_total{namespace="stratum",service="stratum",endpoint="http",path!="unmatched",path!~"^/(health|livez|readyz|metrics)$",path!~".*/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}($|/).*",status=~"5.."}[5m])) / clamp_min(sum by (path) (increase(http_requests_total{namespace="stratum",service="stratum",endpoint="http",path!="unmatched",path!~"^/(health|livez|readyz|metrics)$",path!~".*/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}($|/).*"}[5m])), 1)
          labels:
            service: stratum
            environment: remote-test

        - record: stratum:http_request_duration_seconds_by_path:p95_5m
          expr: histogram_quantile(0.95, sum by (path, le) (rate(http_request_duration_seconds_bucket{namespace="stratum",service="stratum",endpoint="http",path!="unmatched",path!~"^/(health|livez|readyz|metrics)$",path!~".*/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}($|/).*"}[5m])))
          labels:
            service: stratum
            environment: remote-test

        - alert: StratumHighHTTP5xxRate
          expr: stratum:http_5xx_ratio:ratio5m{service="stratum",environment="remote-test"} > 0.05 and stratum:http_requests:increase5m{service="stratum",environment="remote-test"} >= 20
          for: 10m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: http
            alert_family: http-5xx-rate
          annotations:
            summary: Stratum HTTP 5xx rate is elevated
            description: The five-minute HTTP 5xx ratio has exceeded 5% for ten minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-http
            runbook_url: /docs/operations/alerts/http-performance.md#high-http-5xx-rate

        - alert: StratumCriticalHTTP5xxRate
          expr: stratum:http_5xx_ratio:ratio5m{service="stratum",environment="remote-test"} > 0.20 and stratum:http_requests:increase5m{service="stratum",environment="remote-test"} >= 20
          for: 5m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: http
            alert_family: http-5xx-rate
          annotations:
            summary: Stratum HTTP 5xx rate is critical
            description: The five-minute HTTP 5xx ratio has exceeded 20% for five minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-http
            runbook_url: /docs/operations/alerts/http-performance.md#critical-http-5xx-rate

        - alert: StratumHighHTTPP95Latency
          expr: stratum:http_request_duration_seconds:p95_5m{service="stratum",environment="remote-test"} > 2 and on() sum(increase(http_request_duration_seconds_bucket{namespace="stratum",service="stratum",endpoint="http",path!~"^/(health|livez|readyz|metrics)$",le="+Inf"}[5m])) >= 20
          for: 15m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: http
            alert_family: http-p95-latency
          annotations:
            summary: Stratum HTTP P95 latency is elevated
            description: The five-minute HTTP P95 latency has exceeded two seconds for fifteen minutes (current value {{ $value }}s).
            dashboard_url: /d/stratum-http
            runbook_url: /docs/operations/alerts/http-performance.md#high-http-p95-latency

        - alert: StratumCriticalHTTPP95Latency
          expr: stratum:http_request_duration_seconds:p95_5m{service="stratum",environment="remote-test"} > 5 and on() sum(increase(http_request_duration_seconds_bucket{namespace="stratum",service="stratum",endpoint="http",path!~"^/(health|livez|readyz|metrics)$",le="+Inf"}[5m])) >= 20
          for: 5m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: http
            alert_family: http-p95-latency
          annotations:
            summary: Stratum HTTP P95 latency is critical
            description: The five-minute HTTP P95 latency has exceeded five seconds for five minutes (current value {{ $value }}s).
            dashboard_url: /d/stratum-http
            runbook_url: /docs/operations/alerts/http-performance.md#critical-http-p95-latency
    - name: stratum-llm-model
      rules:
        - alert: StratumLLMModelResolutionFailed
          expr: increase(llm_model_resolution_errors_total[5m]) > 0
          for: 2m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: llm-gateway
          annotations:
            summary: LLM 模型解析失败：模型配置失效或无默认模型
            description: >-
              过去 5 分钟 llm_model_resolution_errors_total 出现增长
              （model={{ $labels.model }}，reason={{ $labels.reason }}）。
              invalid_model：显式请求的模型不存在/已禁用/不健康；no_default：
              目录中无可用的默认/推荐模型；resolve_error：注册表解析故障。
              请检查模型管理目录的 models / providers 配置
              （default_model、enabled、recommended、default_embedding），
              修复后告警自动恢复。
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/business.md#llm-model-resolution-failed
    - name: stratum-monitoring
      rules:
        - alert: StratumPrometheusConfigReloadFailed
          expr: min by (namespace) (prometheus_config_last_reload_successful{namespace="monitoring",service="kps-kube-prometheus-stack-prometheus",endpoint="http-web"}) == 0
          for: 10m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: prometheus
          annotations:
            summary: Prometheus configuration reload is failing
            description: Prometheus has reported an unsuccessful configuration reload for ten minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/monitoring-system.md#prometheus-config-reload-failed

        - alert: StratumPrometheusRuleEvaluationFailures
          expr: sum by (namespace) (increase(prometheus_rule_evaluation_failures_total{namespace="monitoring",service="kps-kube-prometheus-stack-prometheus",endpoint="http-web"}[10m])) > 0
          for: 5m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: prometheus
          annotations:
            summary: Prometheus rule evaluations are failing
            description: Prometheus recorded rule evaluation failures during the last ten minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/monitoring-system.md#prometheus-rule-evaluation-failures

        - alert: StratumAlertmanagerNotificationFailures
          expr: sum by (namespace) (increase(alertmanager_notifications_failed_total{namespace="monitoring",service="kps-kube-prometheus-stack-alertmanager",endpoint="http-web"}[10m])) > 0
          for: 5m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: alertmanager
          annotations:
            summary: Alertmanager notifications are failing
            description: Alertmanager recorded notification delivery failures during the last ten minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/monitoring-system.md#alertmanager-notification-failures

        - alert: StratumFeishuAdapterMissing
          expr: absent(up{namespace="monitoring",service="stratum-feishu-alert-adapter",endpoint="http"}) or up{namespace="monitoring",service="stratum-feishu-alert-adapter",endpoint="http"} == 0
          for: 10m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: notification
          annotations:
            summary: Feishu alert adapter is unavailable
            description: Prometheus has been unable to scrape the Feishu adapter for ten minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/monitoring-system.md#feishu-adapter-missing

        - alert: StratumBlackboxExporterMissing
          expr: absent(up{namespace="monitoring",service="stratum-blackbox-prometheus-blackbox-exporter",endpoint="http"}) or up{namespace="monitoring",service="stratum-blackbox-prometheus-blackbox-exporter",endpoint="http"} == 0
          for: 10m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: blackbox
          annotations:
            summary: Blackbox Exporter is unavailable
            description: Prometheus has been unable to scrape Blackbox Exporter for ten minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/monitoring-system.md#blackbox-exporter-missing

        - alert: StratumFeishuDeliveryFailures
          expr: sum(increase(feishu_alert_delivery_total{namespace="monitoring",service="stratum-feishu-alert-adapter",endpoint="http",status="failed"}[10m])) > 0
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: notification
          annotations:
            summary: Feishu alert deliveries are failing
            description: The Feishu adapter recorded at least one failed delivery during the last ten minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/monitoring-system.md#feishu-delivery-failures

        - alert: StratumLokiUnavailable
          expr: absent(up{namespace="monitoring",service="loki",endpoint="http"}) or up{namespace="monitoring",service="loki",endpoint="http"} == 0
          for: 10m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: logging
          annotations:
            summary: Loki is unavailable
            description: Prometheus has been unable to scrape Loki for ten minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/monitoring-system.md#loki-unavailable

        - alert: StratumPromtailUnavailable
          expr: absent(up{namespace="monitoring",service="promtail",endpoint="http"}) or up{namespace="monitoring",service="promtail",endpoint="http"} == 0
          for: 10m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: logging
          annotations:
            summary: Promtail is unavailable
            description: Prometheus has been unable to scrape Promtail for ten minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/monitoring-system.md#promtail-unavailable

        - alert: StratumPromtailNoActiveFiles
          expr: promtail_files_active_total{namespace="monitoring",service="promtail"} == 0
          for: 10m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: logging
          annotations:
            summary: Promtail is not tailing any files
            description: Promtail reports zero active log files for ten minutes (current value {{ $value }}); container logs are not reaching Loki.
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/monitoring-system.md#promtail-no-active-files

        - alert: StratumJaegerUnavailable
          expr: absent(up{namespace="monitoring",service="jaeger",endpoint="admin"}) or up{namespace="monitoring",service="jaeger",endpoint="admin"} == 0
          for: 10m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: tracing
          annotations:
            summary: Jaeger is unavailable
            description: Prometheus has been unable to scrape Jaeger for ten minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/monitoring-system.md#jaeger-unavailable

        - alert: StratumOtelCollectorUnavailable
          expr: absent(up{namespace="stratum",service="stratum-otel-collector",endpoint="metrics"}) or up{namespace="stratum",service="stratum-otel-collector",endpoint="metrics"} == 0
          for: 10m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: tracing
          annotations:
            summary: OTel collector is unavailable
            description: Prometheus has been unable to scrape the OTel collector for ten minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/monitoring-system.md#otel-collector-unavailable

        - alert: StratumOtelExporterFailures
          expr: sum by (exporter) (increase(otelcol_exporter_send_failed_spans{namespace="stratum",service="stratum-otel-collector",endpoint="metrics"}[10m])) > 0
          for: 5m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: tracing
          annotations:
            summary: OTel collector is failing to export spans
            description: The OTel collector recorded span export failures during the last ten minutes (current value {{ $value }}); traces may be missing.
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/monitoring-system.md#otel-exporter-failures

        # 静默 span 丢失盲区：后端在服务请求，但 collector 的 gRPC 传输零接收。
        # 典型触发是 exporter 长连接被 kube-proxy stale conntrack DNAT 钉在已删除的
        # collector backend（IP 被复用），应用"以为在导出"实际全量送错目标。
        # 现有 StratumOtelCollectorUnavailable/StratumOtelExporterFailures 都覆盖不到
        # 该状态：collector up=1、导出失败=0、但接收=0。
        - alert: StratumOtelReceiverSilent
          expr: |
            (
              absent(otelcol_receiver_accepted_spans{namespace="stratum",service="stratum-otel-collector",transport="grpc"})
              or
              sum(increase(otelcol_receiver_accepted_spans{namespace="stratum",service="stratum-otel-collector",transport="grpc"}[10m])) == 0
            )
            and on() (sum(increase(http_requests_total{namespace="stratum",service="stratum"}[10m])) > 0)
          for: 5m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: tracing
          annotations:
            summary: OTel collector receives no spans from the backend
            description: The backend served HTTP requests during the last ten minutes but the OTel collector accepted zero spans on its gRPC transport (current value {{ $value }}); traces are being silently lost, likely a stale kube-proxy conntrack DNAT pinning the app exporter to a replaced collector backend or a misdirected exporter endpoint.
            dashboard_url: /d/stratum-service-overview
            runbook_url: /docs/operations/alerts/monitoring-system.md#otel-receiver-silent
    - name: stratum-workloads
      rules:
        - record: stratum:kube_pod_owner:deployment
          expr: max by (namespace, pod, deployment) (max by (namespace, pod, replicaset) (label_replace(kube_pod_owner{namespace="stratum",owner_kind="ReplicaSet"}, "replicaset", "$1", "owner_name", "(.+)")) * on (namespace, replicaset) group_left (deployment) max by (namespace, replicaset, deployment) (label_replace(kube_replicaset_owner{namespace="stratum",owner_kind="Deployment"}, "deployment", "$1", "owner_name", "(.+)")))

        - record: stratum:kube_pod:placement
          expr: (max by (namespace, pod, node) (kube_pod_info{namespace="stratum"}) * on (namespace, pod) group_left (deployment) stratum:kube_pod_owner:deployment) or on (namespace, pod) max by (namespace, pod, node) (kube_pod_info{namespace="stratum"})

        - alert: StratumNodeNotReady
          expr: max by (node) (kube_node_status_condition{condition="Ready",status="true"} == 0) and on (node) max by (node) (kube_pod_info{namespace="stratum"})
          for: 5m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: node
          annotations:
            summary: Stratum host node is not ready
            description: The node hosting the remote Stratum environment has not been ready for five minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/workloads.md#node-not-ready

        - alert: StratumPodRestartingFrequently
          expr: (increase(kube_pod_container_status_restarts_total{namespace="stratum"}[10m]) > 3) * on (namespace, pod) group_left (node, deployment) stratum:kube_pod:placement
          for: 2m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: workload
            alert_family: pod-health
          annotations:
            summary: A Stratum container is restarting frequently
            description: The container restarted more than three times in ten minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/workloads.md#pod-restarting-frequently

        - alert: StratumPodCumulativeRestarts
          expr: (increase(kube_pod_container_status_restarts_total{namespace="stratum"}[30m]) > 5) * on (namespace, pod) group_left (node, deployment) stratum:kube_pod:placement
          for: 5m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: workload
            alert_family: pod-health
          annotations:
            summary: A Stratum container has accumulated restarts over 30 minutes
            description: The container restarted more than five times in the last 30 minutes without entering CrashLoopBackOff (current value {{ $value }}). This indicates intermittent crashes that recover too quickly for the CrashLooping alert.
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/workloads.md#pod-cumulative-restarts

        - alert: StratumPodCrashLooping
          expr: (kube_pod_container_status_waiting_reason{namespace="stratum",reason="CrashLoopBackOff"} == 1) * on (namespace, pod) group_left (node, deployment) stratum:kube_pod:placement
          for: 5m
          labels:
            severity: critical
            service: stratum
            environment: remote-test
            component: workload
            alert_family: pod-health
          annotations:
            summary: A Stratum container is crash looping
            description: The container has remained in CrashLoopBackOff for five minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/workloads.md#pod-crash-looping

        - alert: StratumPodPendingTooLong
          expr: (kube_pod_status_phase{namespace="stratum",phase="Pending"} == 1) * on (namespace, pod) group_left (node, deployment) stratum:kube_pod:placement
          for: 15m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: workload
          annotations:
            summary: A Stratum pod has remained pending
            description: The pod has remained pending for fifteen minutes (current value {{ $value }}).
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/workloads.md#pod-pending-too-long

        - alert: StratumPodUnhealthyExit
          expr: |
            (increase(kube_pod_container_status_restarts_total{namespace="stratum"}[2h]) >= 2
              and on (namespace, pod, container)
                kube_pod_container_status_last_terminated_reason{namespace="stratum",reason=~"Error|OOMKilled"})
              * on (namespace, pod) group_left (node, deployment) stratum:kube_pod:placement
          for: 5m
          labels:
            severity: warning
            service: stratum
            environment: remote-test
            component: workload
            alert_family: pod-health
          annotations:
            summary: Stratum container exits with non-zero status repeatedly
            description: A container restarted at least twice in two hours with a non-zero exit reason (current value {{ $value }}).
            dashboard_url: /d/stratum-resources
            runbook_url: /docs/operations/alerts/workloads.md#pod-unhealthy-exit
