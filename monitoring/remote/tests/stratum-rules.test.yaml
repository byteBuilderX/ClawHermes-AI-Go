        alertname: StratumEvalQueueBacklogHigh
        exp_alerts: []
      - eval_time: 14m
        alertname: StratumEvalQueueBacklogHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: StratumEvalQueueBacklogHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              service: evaluation
              component: observation-consumer
              environment: remote-test
              queue: observation
            exp_annotations:
              summary: 评测观测队列积压超过阈值（当前 1200）
              description: "评测观测消费队列（queue=observation）积压持续 > 1000 达 15 分钟。消费 停滞将延迟观测落库与采样覆盖统计，检查 observation consumer 健康状况。"
              dashboard_url: https://stratum.grafana/d/evaluation
              runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-queue-backlog-high

  - name: evaluation queue backlog does not fire below threshold
    interval: 1m
    input_series:
      - series: 'eval_queue_backlog{queue="observation"}'
        values: '1000x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StratumEvalQueueBacklogHigh
        exp_alerts: []

  - name: evaluation queue backlog does not fire for non-observation queues
    interval: 1m
