groups:
  - name: stratum-evaluation-observability
    rules:
      - alert: StratumEvalBehaviorAnomaly
        expr: |
          rate(eval_behavior_anomaly_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: evaluation
          component: runtime-observation
          environment: remote-test
        annotations:
          summary: 评测行为异常判异升高
          description: >-
            运行态观测行为异常判异速率 {{ $value | printf "%.2f" }}/s（signal 维度见
            labels），持续 5 分钟。检查判异来源（judge 跌阈 / 行为放弃 / 规则命中）并
            到评测中心下钻对应 trace。
          dashboard_url: https://stratum.grafana/d/evaluation
          runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-behavior-anomaly
      - alert: StratumEvalSampleCoverageLow
        expr: |
          eval_sample_coverage < 0.5
        for: 10m
        labels:
          severity: warning
          service: evaluation
          component: runtime-observation
          environment: remote-test
        annotations:
          summary: 评测主动采样覆盖率不足
          description: >-
            eval_sample_coverage（落库/采样候选）低于 0.5 持续 10 分钟，可能 judge
            整层故障降级、校验非法或落库失败导致观测静默丢失。核对 judge 可用性与
            落库链路，禁止静默跳过某层（§14）。judge 配置关闭属主动停观测，不计入分母。
          dashboard_url: https://stratum.grafana/d/evaluation
          runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-sample-coverage-low
      - alert: StratumEvalRuleBlocked
        expr: |
          rate(eval_rule_hit_total{verdict="block"}[5m]) > 0
        for: 5m
        labels:
          severity: critical
          service: evaluation
          component: runtime-observation
          environment: remote-test
        annotations:
          summary: 规则护栏命中拦截
          description: >-
            规则护栏即时拦截速率 > 0（rule={{ $labels.rule }}），持续 5 分钟。
            T4 红线级：按 runbook 立即人工确认并处置。
          dashboard_url: https://stratum.grafana/d/evaluation
          runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-rule-blocked
      - alert: StratumEvalRuleDisabled
        expr: |
          increase(eval_rule_hit_total{verdict="detected"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          service: evaluation
          component: runtime-observation
          environment: remote-test
        annotations:
          summary: 规则护栏命中但未拦截
          description: >-
            检测到规则护栏命中但未拦截：evaluation.ruleguard.enabled=false 但 denylist 非空，
            命中 verdict=detected 持续 5 分钟。护栏当前只检测不拦截，命中工具照常执行。若该
            工具应禁用，请开启 evaluation.ruleguard.enabled；否则收紧 denylist 移除误报。
          dashboard_url: https://stratum.grafana/d/evaluation
          runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-rule-disabled
      - alert: StratumEvalJudgeDegraded
        # 事件计数阈值而非瞬时 rate>0：任一 30 分钟窗口内 judge_unavailable 累计 ≥ 3 次
        # 且持续 15 分钟才告警，隔离单次瞬时抖动。恢复后需等失败事件滚出窗口自动消除。
        expr: |
          increase(eval_judge_failure_total{reason="judge_unavailable"}[30m]) >= 3
        for: 15m
        labels:
          severity: warning
          service: evaluation
          component: judge
          environment: remote-test
        annotations:
          summary: judge 外部依赖持续不可用
          description: >-
            30 分钟内 judge_unavailable 失败累计 ≥ 3 次（事件计数阈值）并持续 15 分钟
            （§11.2 judge 健康）。judge 是异步外部依赖，需有超时预算、有限重试与熔断/隔离；
            核对 LLM provider 可用性、限额与配置，恢复后告警自动消除。
          dashboard_url: https://stratum.grafana/d/evaluation
          runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-judge-degraded
      - alert: StratumEvalQueueBacklogHigh
        # 只告警评测观测消费队列（observation），排除同指标下其它语义的队列。
        expr: |
          eval_queue_backlog{queue="observation"} > 1000
        for: 15m
        labels:
          severity: warning
          service: evaluation
          component: observation-consumer
          environment: remote-test
        annotations:
          summary: 评测观测队列积压超过阈值（当前 {{ $value }}）
          description: >-
            评测观测消费队列（queue=observation）积压持续 > 1000 达 15 分钟。消费
            停滞将延迟观测落库与采样覆盖统计，检查 observation consumer 健康状况。
          dashboard_url: https://stratum.grafana/d/evaluation
          runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-queue-backlog-high
      - alert: StratumEvalReviewBacklogHigh
        expr: |
          eval_review_backlog > 50
        for: 15m
        labels:
          severity: warning
          service: stratum-evaluation
          component: review-pool
          environment: production
        annotations:
          summary: "人工评审池积压超过阈值（当前 {{ $value }}）"
          description: "待评审条目持续 > 50 达 15 分钟，低置信/判异样本滞留，需人工介入。"
          dashboard_url: "{{ $externalURL }}"
          runbook_url: /docs/runbooks/stratum-eval-review-backlog.md#stratum-eval-review-backlog-high
      - alert: StratumEvalJudgeBelowThreshold
        expr: |
          increase(eval_gate_action_total{layer="detect",action="flag"}[15m]) > 0 OR (sum(rate(eval_judge_score_bucket{le="0.5"}[10m])) / clamp_min(sum(rate(eval_judge_score_count[10m])), 1)) > 0.3
        for: 10m
        labels:
          severity: warning
          service: evaluation
          component: runtime-observation
          environment: remote-test
        annotations:
          summary: judge 跌阈判定升高（低分尾部占比超阈值）
          description: >-
            judge 单维度低于 JudgeBelowThreshold 的判异升高：detect/flag 计数 15 分钟
            increase &gt; 0，或 eval_judge_score 直方图 &lt;0.5 尾部占比 &gt; 30%（10 分钟
            窗口）。第一腿信号现网即燃（applyAnomalyVerdict emit layer=detect action=flag）。
            到评测中心下钻对应 trace，人工确认真退化后走参数/版本调整。
          dashboard_url: https://stratum.grafana/d/evaluation
          runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-judge-below-threshold
      - alert: StratumEvalRunRegression
        expr: |
          increase(eval_gate_action_total{layer="l2",action="regression"}[15m]) > 0
        for: 10m
        labels:
          severity: warning
          service: evaluation
          component: runtime-observation
          environment: remote-test
        annotations:
          summary: run 级回归劣化判异
          description: >-
            run 级回归判异出现（layer=l2 action=regression，15 分钟 increase &gt; 0）。
            P2 该 label 值仅由发布哨兵判劣 emit（Task 5），T13 确认 run 复用；规则先落、当前
            只读待命。到评测中心对比 base vs current run 的 by_dimension 并人工确认。
          dashboard_url: https://stratum.grafana/d/evaluation
          runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-run-regression
      - alert: StratumEvalMultiTenantVerifyNotRecovered
        expr: |
          increase(eval_gate_action_total{layer="l3_multitenant_verify",action="not_recovered"}[30m]) >= 1
        for: 5m
        labels:
          severity: critical
          service: evaluation
          component: l3-plus-platform
          environment: remote-test
        annotations:
          summary: 平台回滚后多租户验证存在未恢复租户（当前 {{ $value }}）
          description: >-
            平台版本回滚后 multi-tenant verify 判定 ≥ 1 个租户 not_recovered（回滚后
            该租户表现仍劣于回滚前），持续 5 分钟。平台参数影响全租户，属 T4 红线级；
            按 runbook 立即人工确认并处置。
          dashboard_url: https://stratum.grafana/d/evaluation
          runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-multitenant-verify-not-recovered
      - alert: StratumEvalPlatformMultiTenantDivergence
        expr: |
          increase(eval_gate_action_total{layer="l3_multitenant_verify",action="not_recovered"}[30m]) > 0
            AND increase(eval_gate_action_total{layer="l3_multitenant_verify",action="recovered"}[30m]) > 0
        for: 10m
        labels:
          severity: warning
          service: evaluation
          component: l3-plus-platform
          environment: remote-test
        annotations:
          summary: 平台版本多租户验证出现分化（多数恢复 / 少数未恢复）
          description: >-
            同一平台版本窗口内 recovered 与 not_recovered 并存（多数改善少数劣化分布效应，
            spec §3.4-4 / §9.4.2）。仅信号告警不做自动处置；劣化租户名单供人工在归因视图下钻。
          dashboard_url: https://stratum.grafana/d/evaluation
          runbook_url: /docs/operations/alerts/stratum-evaluation.md#stratum-eval-platform-multitenant-divergence
