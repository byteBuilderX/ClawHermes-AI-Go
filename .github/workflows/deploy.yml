name: Build and Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY_URL }}
  IMAGE_REPO: ${{ secrets.DOCKER_REGISTRY_URL }}/stratum-demo
  IMAGE_NAME: stratum
  DOCKER_HUB_MIRROR: ${{ vars.DOCKER_HUB_MIRROR || 'https://docker.m.daocloud.io' }}

jobs:
  candidate:
    name: Resolve Deployment Candidate
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve and verify immutable candidate
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          candidate_sha="$EVENT_SHA"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            [[ "$WORKFLOW_CONCLUSION" == "success" ]] || {
              echo 'triggering CI workflow did not succeed' >&2
              exit 1
            }
            [[ "$WORKFLOW_HEAD_BRANCH" == "main" ]] || {
              echo 'triggering CI workflow is not for main' >&2
              exit 1
            }
            candidate_sha="$WORKFLOW_HEAD_SHA"
            current_sha=$(curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/commits/main" | jq -er '.sha')
            [[ "$candidate_sha" == "$current_sha" ]] || {
              echo "deployment candidate $candidate_sha was superseded by $current_sha" >&2
              exit 1
            }
          fi
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'deployment candidate is not an immutable commit SHA' >&2
            exit 1
          }
          echo "sha=$candidate_sha" >>"$GITHUB_OUTPUT"

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      # 生成物 api/http/dto/gen、web/src/services/gen 不入 git,fresh checkout
      # 编译前必须先 make proto-gen,否则 go build ./cmd/server 找不到生成包。
      - name: Generate proto contracts
        run: make proto-gen

      - name: Build Go binary
        run: |
          CGO_ENABLED=0 GOOS=linux go build -o server ./cmd/server
          CGO_ENABLED=0 GOOS=linux go build -o fix-provider-keys ./cmd/fix-provider-keys
          CGO_ENABLED=0 GOOS=linux go build -o migrate-public ./cmd/migrate-public

      - name: Configure Docker Hub mirror
        run: |
          sudo bash -c 'cat > /etc/docker/daemon.json <<DAEMONEOF
          {
            "registry-mirrors": ["${{ env.DOCKER_HUB_MIRROR }}"]
          }
          DAEMONEOF'
          sudo systemctl restart docker
          sleep 2
          docker info | grep -A5 "Registry Mirrors"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=raw,value=${{ needs.candidate.outputs.sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # ACR 拒绝 buildx 默认 attestation 的 OCI empty manifest class,
          # 必须禁用 provenance/sbom,否则 push 失败 denied: unknown manifest class。
          provenance: false
          sbom: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      # web 源码 import web/src/services/gen/**(不入 git),docker build 前
      # 必须在 checkout 工作区先生成,否则 web/Dockerfile 的 npm run build 失败。
      - name: Generate proto contracts
        run: make proto-gen

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # gha cache 需要 docker-container driver;默认 docker driver 不支持 cache export
      # （backend/adapter 均有 setup-buildx-action,frontend 恢复 gha cache 时必须对齐）。
      - uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}-frontend:${{ needs.candidate.outputs.sha }}
          # 与 backend/adapter 一致:ACR 拒绝 buildx 默认 attestation,禁用 provenance/sbom。
          provenance: false
          sbom: false
          # #219 用 no-cache 绕过 BuildKit overlay bug;根因(web/.dockerignore 排除
          # node_modules + Dockerfile 依赖层序)已修,恢复 gha cache,源码变更只重跑
          # npm ci 之后的层,省去每次部署的前端冷构建。
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  build-feishu-adapter:
    name: Build Feishu Alert Adapter
    runs-on: ubuntu-latest
    needs: candidate
    outputs:
      digest: ${{ steps.adapter-build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}

      - name: Configure Docker Hub mirror
        run: |
          sudo bash -c 'cat > /etc/docker/daemon.json <<DAEMONEOF
          {
            "registry-mirrors": ["${{ env.DOCKER_HUB_MIRROR }}"]
          }
          DAEMONEOF'
          sudo systemctl restart docker
          sleep 2
          docker info | grep -A5 "Registry Mirrors"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Feishu alert adapter
        id: adapter-build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/feishu-alert-adapter.Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}/stratum-feishu-alert-adapter:${{ needs.candidate.outputs.sha }}
          # 同 backend:ACR 拒绝 buildx 默认 attestation 的 OCI empty manifest class。
          provenance: false
          sbom: false
          cache-from: type=gha,scope=feishu-alert-adapter
          cache-to: type=gha,scope=feishu-alert-adapter,mode=max

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [candidate, build-backend, build-frontend, build-feishu-adapter]
    outputs:
      image-tag: ${{ needs.candidate.outputs.sha }}
      adapter-digest: ${{ needs.build-feishu-adapter.outputs.digest }}
      sha: ${{ needs.candidate.outputs.sha }}
    steps:
      - name: Confirm image builds
        run: echo "All application images were built and pushed successfully."

  deploy:
    name: Deploy to K3s
    runs-on: ubuntu-latest
    needs: [candidate, build-and-push]
    environment: production
    env:
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
    concurrency:
      group: stratum-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Validate remote HTTP configuration
        run: bash scripts/quality/validate-remote-http-base-url.sh "$PUBLIC_BASE_URL"

      - name: Sanitize PUBLIC_BASE_URL
        run: |
          CLEAN_URL="$(echo "$PUBLIC_BASE_URL" | xargs)"
          echo "PUBLIC_BASE_URL=$CLEAN_URL" >> "$GITHUB_ENV"

      - name: Configure Docker Hub mirror
        run: |
          sudo bash -c 'cat > /etc/docker/daemon.json <<DAEMONEOF
          {
            "registry-mirrors": ["${{ env.DOCKER_HUB_MIRROR }}"]
          }
          DAEMONEOF'
          sudo systemctl restart docker
          sleep 2
          docker info | grep -A5 "Registry Mirrors"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish dependency images and resolve digests
        id: images
        run: |
          require_digest() {
            local image="$1" output_name="$2" digest
            digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "invalid registry digest for $image" >&2
              return 1
            fi
            echo "$output_name=$digest" >> "$GITHUB_OUTPUT"
          }

          publish_dependency() {
            local source="$1" destination="$2" output_name="$3"
            if require_digest "$destination" "$output_name" >/dev/null 2>&1; then
              echo "$output_name: already published, skipping transfer of $source"
              return
            fi
            echo "$output_name: publishing $source -> $destination"
            docker pull "$source"
            docker tag "$source" "$destination"
            docker push "$destination"
            require_digest "$destination" "$output_name" >/dev/null
          }

          postgres_image="${{ env.IMAGE_REPO }}/postgres:16-zhparser-v1"
          if ! require_digest "$postgres_image" postgres >/dev/null 2>&1; then
            echo "postgres: building and publishing $postgres_image"
            docker build -f docker/postgres-zhparser.Dockerfile -t "$postgres_image" .
            docker push "$postgres_image"
            require_digest "$postgres_image" postgres >/dev/null
          else
            echo "postgres: already published, skipping build"
          fi

          publish_dependency redis:7.2.10-alpine3.21 \
            "${{ env.IMAGE_REPO }}/redis:7.2.10-alpine3.21" redis
          publish_dependency nats:2.10.25-alpine \
            "${{ env.IMAGE_REPO }}/nats:2.10.25-alpine" nats
          publish_dependency quay.io/coreos/etcd:v3.5.16 \
            "${{ env.IMAGE_REPO }}/etcd:v3.5.16" etcd
          publish_dependency minio/minio:RELEASE.2025-04-22T22-12-26Z \
            "${{ env.IMAGE_REPO }}/minio:RELEASE.2025-04-22T22-12-26Z" minio
          publish_dependency milvusdb/milvus:v2.4.15 \
            "${{ env.IMAGE_REPO }}/milvus:v2.4.15" milvus
          publish_dependency nacos/nacos-server:v2.5.1 \
            "${{ env.IMAGE_REPO }}/nacos:v2.5.1" nacos
          publish_dependency mysql:8.4 \
            "${{ env.IMAGE_REPO }}/mysql:8.4" nacos_mysql

          require_digest "${{ env.IMAGE_REPO }}/stratum-backend:${{ needs.build-and-push.outputs.image-tag }}" backend
          require_digest "${{ env.IMAGE_REPO }}/stratum-frontend:${{ needs.build-and-push.outputs.image-tag }}" frontend

      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Setup SSH tunnel to K3s
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ExitOnForwardFailure=yes \
            -i ~/.ssh/deploy_key \
            -fN -L 6443:127.0.0.1:6443 \
            root@${{ secrets.SSH_DEPLOY_HOST }}
          sleep 2

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify cluster
        run: kubectl get nodes

      - name: Install pinned cert-manager release
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update jetstack
          if helm list -n cert-manager -o json \
              | jq -e '.[] | select(.name == "cert-manager") | .chart | test("^cert-manager-(v?1\\.21\\.1)$")' >/dev/null; then
            echo "cert-manager-1.21.1 already installed: skipping upgrade"
          else
            helm upgrade --install cert-manager jetstack/cert-manager \
              --namespace cert-manager --create-namespace \
              --version v1.21.1 \
              --set crds.enabled=true \
              --atomic --wait --timeout=10m
          fi
          kubectl wait --for=condition=Established crd/certificates.cert-manager.io --timeout=2m

      - name: Bootstrap internal workload CA
        run: |
          cat <<'YAML' | kubectl apply -f -
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: stratum-internal-root-bootstrap
          spec:
            selfSigned: {}
          ---
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: stratum-internal-root-ca
            namespace: cert-manager
          spec:
            isCA: true
            commonName: stratum-internal-root-ca
            subject:
              organizations:
                - Stratum
            secretName: stratum-internal-root-ca
            duration: 87600h
            renewBefore: 720h
            issuerRef:
              name: stratum-internal-root-bootstrap
              kind: ClusterIssuer
              group: cert-manager.io
          ---
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: stratum-internal-ca
          spec:
            ca:
              secretName: stratum-internal-root-ca
          YAML
          kubectl wait --for=condition=Ready clusterissuer/stratum-internal-root-bootstrap --timeout=2m
          kubectl wait --for=condition=Ready certificate/stratum-internal-root-ca \
            --namespace cert-manager --timeout=2m
          kubectl wait --for=condition=Ready clusterissuer/stratum-internal-ca --timeout=2m

      - name: Apply monitoring credentials
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REGISTRY_SERVER: ${{ secrets.DOCKER_REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          test -n "$FEISHU_WEBHOOK_URL"
          test -n "$REGISTRY_SERVER"
          test -n "$REGISTRY_USERNAME"
          test -n "$REGISTRY_PASSWORD"
          adapter_digest="${{ needs.build-and-push.outputs.adapter-digest }}"
          if [[ ! "$adapter_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'invalid Feishu adapter image digest' >&2
            exit 1
          fi
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic stratum-monitoring-secrets \
            --namespace monitoring \
            --from-literal=FEISHU_WEBHOOK_URL="$FEISHU_WEBHOOK_URL" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry aliyun-registry \
            --namespace monitoring \
            --docker-server="$REGISTRY_SERVER" \
            --docker-username="$REGISTRY_USERNAME" \
            --docker-password="$REGISTRY_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Diagnose ingress edge
        run: |
          # github vars may contain leading/trailing whitespace — sanitize
          PUBLIC_AUTHORITY="$(echo "${PUBLIC_BASE_URL#https://}" | xargs)"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            -i ~/.ssh/deploy_key root@${{ secrets.SSH_DEPLOY_HOST }} \
            bash -s -- "$PUBLIC_AUTHORITY" <<'REMOTE'
          PUBLIC_AUTHORITY="$1"
          echo "=== Host edge listeners ==="
          ss -H -ltnp "( sport = :443 or sport = :8443 )"
          echo "=== Host-local HTTP health ==="
          probe_status() {
            local label="$1"
            shift
            if status=$(curl --silent --insecure --output /dev/null --max-time 5 \
              --write-out "%{http_code}" "$@"); then
              echo "$label status=$status"
            else
              echo "$label request failed before receiving an HTTP response"
            fi
          }
          probe_status "host-local default Host" https://127.0.0.1:8443/api/health
          probe_status "host-local port 8443 public Host" \
            --header "Host: $PUBLIC_AUTHORITY" https://127.0.0.1:8443/api/health
          echo "=== Traefik service ==="
          kubectl get service traefik -n kube-system -o wide
          kubectl get service traefik -n kube-system -o json | jq -r \
            '.spec.ports[] | "service port name=\(.name) port=\(.port) targetPort=\(.targetPort)"'
          echo "=== Traefik entrypoint arguments ==="
          kubectl get deployment traefik -n kube-system -o json | jq -r \
            '.spec.template.spec.containers[].args[] | select(startswith("--entryPoints."))'
          echo "=== Traefik ServiceLB pods ==="
          kubectl get pods -n kube-system \
            -l svccontroller.k3s.cattle.io/svcname=traefik -o wide
          REMOTE

      - name: Apply namespace and secrets
        # 全局系统提示词已迁平台参数 agent.system_prompt（平台参数页配置，
        # 未配置即 agent 执行 fail-closed）；不再经部署 env 下发。
        env:
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD || secrets.POSTGRES_PASSWORD }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          NACOS_PASSWORD: ${{ secrets.NACOS_PASSWORD }}
          NACOS_MYSQL_PASSWORD: ${{ secrets.NACOS_MYSQL_PASSWORD }}
          NACOS_AUTH_IDENTITY_KEY: ${{ secrets.NACOS_AUTH_IDENTITY_KEY }}
          NACOS_AUTH_IDENTITY_VALUE: ${{ secrets.NACOS_AUTH_IDENTITY_VALUE }}
          NACOS_AUTH_TOKEN: ${{ secrets.NACOS_AUTH_TOKEN }}
        run: |
          test -n "$NACOS_PASSWORD"
          test -n "$NACOS_MYSQL_PASSWORD"
          test -n "$NACOS_AUTH_IDENTITY_KEY"
          test -n "$NACOS_AUTH_IDENTITY_VALUE"
          test -n "$NACOS_AUTH_TOKEN"
          kubectl create namespace stratum --dry-run=client -o yaml | kubectl apply -f -
          JWT_KEY=$(echo "${{ secrets.JWT_PRIVATE_KEY }}" | base64 -d)
          # 评测被测建档（agent/knowledge）的 eval revision 对象存储复用 trace-payload
          # MinIO：access/secret 必须注入，否则 buildRevisionObjectStore 静默跳过、
          # baseline providers 未注册 →「登记被测资源」500。minio rootUser=minioadmin，
          # 密码与 minio 初始化共用 MINIO_ROOT_PASSWORD。
          kubectl create secret generic stratum-secrets \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            --from-literal=JWT_PRIVATE_KEY_PEM="$JWT_KEY" \
            --from-literal=GITHUB_CLIENT_ID="$GITHUB_CLIENT_ID" \
            --from-literal=GITHUB_CLIENT_SECRET="$GITHUB_CLIENT_SECRET" \
            --from-literal=NACOS_PASSWORD="$NACOS_PASSWORD" \
            --from-literal=NACOS_MYSQL_PASSWORD="$NACOS_MYSQL_PASSWORD" \
            --from-literal=NACOS_AUTH_IDENTITY_KEY="$NACOS_AUTH_IDENTITY_KEY" \
            --from-literal=NACOS_AUTH_IDENTITY_VALUE="$NACOS_AUTH_IDENTITY_VALUE" \
            --from-literal=NACOS_AUTH_TOKEN="$NACOS_AUTH_TOKEN" \
            --from-literal=TRACE_PAYLOAD_ACCESS_KEY="minioadmin" \
            --from-literal=TRACE_PAYLOAD_SECRET_KEY="$MINIO_ROOT_PASSWORD" \
            -n stratum --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry aliyun-registry \
            --docker-server="${{ secrets.DOCKER_REGISTRY_URL }}" \
            --docker-username="${{ secrets.DOCKER_USERNAME }}" \
            --docker-password="${{ secrets.DOCKER_PASSWORD }}" \
            -n stratum --dry-run=client -o yaml | kubectl apply -f -

      - name: Install metrics-server (K3s)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
          args=$(kubectl get deployment metrics-server -n kube-system \
            -o jsonpath='{.spec.template.spec.containers[0].args[*]}')
          if [[ " $args " != *" --kubelet-insecure-tls "* ]]; then
            kubectl patch deployment metrics-server -n kube-system \
              --type='json' \
              -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          fi

      - name: Install pinned Opik observability release
        run: |
          if helm list -n opik -o json \
              | jq -e '.[] | select(.name == "opik") | .chart | test("^opik-(v?2\\.1\\.32)$")' >/dev/null; then
            echo "opik-2.1.32 already installed: skipping upgrade"
          else
            curl --fail-with-body --location --output /tmp/opik-2.1.32.tgz \
              https://raw.githubusercontent.com/comet-ml/opik/gh-pages/opik-2.1.32.tgz
            echo "c0a4642569e06c9c4890702bfd3a0e87e9559d36847559504168e26295fc3524  /tmp/opik-2.1.32.tgz" \
              | sha256sum --check
            helm upgrade --install opik /tmp/opik-2.1.32.tgz \
              --namespace opik --create-namespace \
              -f helm/opik/values-demo.yaml \
              --atomic --wait --timeout=20m
            kubectl rollout status deployment/opik-backend -n opik --timeout=10m
            kubectl get pods -n opik -o wide
          fi

      - name: Apply Opik OTLP collector
        run: |
          kubectl apply -f k8s/opik-otel-collector.yaml
          kubectl rollout status deployment/opik-otel-collector -n stratum --timeout=5m
          kubectl get service stratum-otel-collector -n stratum

      - name: Capture prior deployment digests
        id: prior-digests
        run: |
          capture_prior() {
            if kubectl get deployment "$1" -n "$2" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null; then
              return 0
            fi
            printf 'none'
          }
          prior_backend="$(capture_prior stratum stratum)"
          prior_frontend="$(capture_prior stratum-frontend stratum)"
          prior_feishu_adapter="$(capture_prior stratum-feishu-alert-adapter monitoring)"
          jq -n --arg backend "${prior_backend:-none}" --arg frontend "${prior_frontend:-none}" \
            --arg feishu_adapter "${prior_feishu_adapter:-none}" \
            '{backend:$backend,frontend:$frontend,feishu_adapter:$feishu_adapter}' \
            > /tmp/prior-digests.json
          jq -e . /tmp/prior-digests.json >/dev/null

      - name: Helm deploy
        id: helm-deploy
        run: |
          EXTERNAL_SECRET_CHECKSUM="$(kubectl get secret stratum-secrets -n stratum -o json | jq -cS '{data:.data,type:.type}' | sha256sum | awk '{print $1}')"
          helm upgrade --install stratum ./helm \
            -f helm/values-demo.yaml \
            -f helm/values-demo-remote-http.yaml \
            --set app.image.repository="${{ env.IMAGE_REPO }}/stratum-backend" \
            --set-string app.image.digest="${{ steps.images.outputs.backend }}" \
            --set frontend.image.repository="${{ env.IMAGE_REPO }}/stratum-frontend" \
            --set-string frontend.image.digest="${{ steps.images.outputs.frontend }}" \
            --set database.image.repository="${{ env.IMAGE_REPO }}/postgres" \
            --set-string database.image.digest="${{ steps.images.outputs.postgres }}" \
            --set redis.image.repository="${{ env.IMAGE_REPO }}/redis" \
            --set-string redis.image.digest="${{ steps.images.outputs.redis }}" \
            --set nats.image.repository="${{ env.IMAGE_REPO }}/nats" \
            --set-string nats.image.digest="${{ steps.images.outputs.nats }}" \
            --set etcd.image.repository="${{ env.IMAGE_REPO }}/etcd" \
            --set-string etcd.image.digest="${{ steps.images.outputs.etcd }}" \
            --set minio.image.repository="${{ env.IMAGE_REPO }}/minio" \
            --set-string minio.image.digest="${{ steps.images.outputs.minio }}" \
            --set milvus.image.repository="${{ env.IMAGE_REPO }}/milvus" \
            --set-string milvus.image.digest="${{ steps.images.outputs.milvus }}" \
            --set nacos.image.repository="${{ env.IMAGE_REPO }}/nacos" \
            --set-string nacos.image.digest="${{ steps.images.outputs.nacos }}" \
            --set nacos.mysql.image.repository="${{ env.IMAGE_REPO }}/mysql" \
            --set-string nacos.mysql.image.digest="${{ steps.images.outputs.nacos_mysql }}" \
            --set-string secrets.externalChecksum="${EXTERNAL_SECRET_CHECKSUM}" \
            --set-string config.opikUrl="http://opik-backend.opik.svc.cluster.local:8080" \
            --set-string config.frontendUrl="$PUBLIC_BASE_URL" \
            --set-string config.githubCallbackUrl="$PUBLIC_BASE_URL/api/auth/github/callback" \
            --set-string config.secureCookies="false" \
            -n stratum --atomic --wait --timeout=10m

      - name: Apply core observability manifests (Loki/Promtail/Jaeger/OTel collector)
        env:
          # Promtail verification curls the hostNetwork metrics endpoint
          # directly over SSH (kubectl port-forward through the API tunnel was
          # flaky); the deploy key is provisioned by the earlier tunnel step.
          SSH_DEPLOY_HOST: ${{ secrets.SSH_DEPLOY_HOST }}
        run: |
          # Logging + tracing manifests are not part of the helm chart; apply
          # them here. Must run after the helm deploy so stratum-config already
          # carries OPIK_OTLP_ENDPOINT (added to the chart ConfigMap) that the
          # otel-collector env references — otherwise the pod fails with
          # CreateContainerConfigError on a missing configMap key.
          # The script rolls workloads whose mounted ConfigMap changed (kubectl
          # apply alone does not) and fails closed unless Promtail is actively
          # tailing files and pushing bytes to Loki.
          bash scripts/deploy-observability-logging.sh

      - name: Apply observability ServiceMonitors and alert rules
        run: |
          # Scrape targets + PrometheusRule for the observability stack. The
          # kps Prometheus selects these via the release:kps label; the rule
          # file is rendered from monitoring/remote/rules (single source,
          # verified by render-monitoring-rules.sh --check).
          kubectl apply -f monitoring/remote/resources/observability-monitors.yaml
          kubectl apply -f monitoring/remote/generated/stratum-prometheus-rules.yaml

      - name: Diagnose deployment
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n stratum -o wide
          echo "=== Deployments ==="
          kubectl get deployments -n stratum
          echo "=== Ingress ==="
          kubectl get ingress -n stratum -o wide
          echo "=== Service endpoints ==="
          kubectl get endpoints stratum stratum-frontend -n stratum
          echo "=== Events ==="
          kubectl get events -n stratum --sort-by='.lastTimestamp' | tail -30
          echo "=== Pod describe (if any failed) ==="
          kubectl get pods -n stratum --field-selector=status.phase!=Running -o name | xargs -r kubectl describe -n stratum

      - name: Fail if helm deploy failed
        if: steps.helm-deploy.outcome == 'failure'
        run: exit 1

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/stratum -n stratum
          kubectl get pods -n stratum

          kubectl port-forward service/stratum-frontend 18080:80 -n stratum \
            >/tmp/stratum-frontend-port-forward.log 2>&1 &
          port_forward_pid=$!
          public_health_body=$(mktemp)
          cleanup_port_forward() {
            if kill "$port_forward_pid" >/dev/null 2>&1; then
              wait "$port_forward_pid" >/dev/null 2>&1 || :
            fi
            /usr/bin/rm -f -- "$public_health_body"
          }
          trap cleanup_port_forward EXIT

          internal_ready=false
          for _ in $(seq 1 15); do
            if curl --silent --output /dev/null --max-time 2 \
              http://127.0.0.1:18080/api/health; then
              internal_ready=true
              break
            fi
            if ! kill -0 "$port_forward_pid" >/dev/null 2>&1; then
              echo "internal frontend port-forward stopped unexpectedly" >&2
              exit 1
            fi
            sleep 1
          done
          if [[ "$internal_ready" != "true" ]]; then
            echo "internal frontend health endpoint did not become ready" >&2
            exit 1
          fi
          echo "internal frontend health status=200"

          if ! public_status=$(curl --silent --insecure --output "$public_health_body" --max-time 15 \
            --write-out '%{http_code}' "$PUBLIC_BASE_URL/api/health"); then
            echo "public health request failed before receiving an HTTP response" >&2
            exit 1
          fi
          echo "public health status=$public_status"
          if [[ "$public_status" != "200" ]]; then
            exit 1
          fi
          if ! jq -e '.status == "ok" and .service == "Stratum"' "$public_health_body" >/dev/null; then
            echo "public health response did not match the backend contract" >&2
            exit 1
          fi

      - name: Clear stale conntrack entries to otel collector VIP
        run: |
          # A recreated app pod can reuse the old pod IP and OTLP src port. When
          # that 5-tuple still has a stale DNAT entry in the node conntrack table
          # (pinning to a replaced collector backend), the new exporter connection
          # is hijacked to the stale backend IP and traces are silently lost —
          # kube-proxy rules are never consulted for the already-established flow.
          # Clearing entries to the collector Service VIP forces those flows to
          # re-resolve through the current kube-proxy DNAT rules; the OTLP exporter
          # then reconnects (same self-heal verified manually on the node).
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            -i ~/.ssh/deploy_key root@${{ secrets.SSH_DEPLOY_HOST }} bash -s <<'REMOTE'
          set -e
          if ! command -v conntrack >/dev/null 2>&1; then
            echo "installing conntrack-tools"
            apt-get update -qq && apt-get install -y -qq conntrack
          fi
          VIP="$(kubectl get svc -n stratum stratum-otel-collector -o jsonpath='{.spec.clusterIP}')"
          if [[ -z "$VIP" || "$VIP" == "None" ]]; then
            echo "stratum-otel-collector has no ClusterIP; nothing to clean" >&2
            exit 1
          fi
          before="$(conntrack -L -p tcp --dst "$VIP" --dport 4317 2>/dev/null | wc -l)"
          set +e
          conntrack -D -p tcp --dst "$VIP" --dport 4317
          cleanup_rc=$?
          set -e
          # conntrack -D exits 1 when no flow matched the filter (nothing to
          # delete) — benign during steady state. Any other non-zero exit is a
          # real failure and must fail the deploy; do not swallow it.
          if [[ "$cleanup_rc" -ne 0 && "$cleanup_rc" -ne 1 ]]; then
            echo "conntrack -D to ${VIP}:4317 failed with rc=$cleanup_rc" >&2
            exit "$cleanup_rc"
          fi
          after="$(conntrack -L -p tcp --dst "$VIP" --dport 4317 2>/dev/null | wc -l)"
          echo "otel-collector conntrack flows to ${VIP}:4317: before=$before after=$after"
          REMOTE

      - name: Prune stale node images after rollout
        run: |
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            -i ~/.ssh/deploy_key root@${{ secrets.SSH_DEPLOY_HOST }} bash -s <<'REMOTE'
          used_pct=$(df --output=pcent /var/lib/rancher/k3s | tail -1 | tr -dc '0-9')
          echo "node disk usage before prune: ${used_pct}%"
          if (( used_pct >= 75 )); then
            k3s ctr images prune
            df -h /var/lib/rancher/k3s | tail -1
          else
            echo "node disk ${used_pct}% below 75% threshold; skipping image prune"
          fi
          REMOTE

      - name: Record deployed application digests
        id: deployment-evidence
        run: |
          mkdir -p tmp/deployment-evidence
          backend=$(kubectl get deployment stratum -n stratum -o jsonpath='{.spec.template.spec.containers[0].image}')
          frontend=$(kubectl get deployment stratum-frontend -n stratum -o jsonpath='{.spec.template.spec.containers[0].image}')
          feishu_adapter=$(kubectl get deployment stratum-feishu-alert-adapter -n monitoring -o jsonpath='{.spec.template.spec.containers[0].image}')
          migration=passed
          health=passed
          rollback=pending
          prior_digests="$(cat /tmp/prior-digests.json)"
          prior_count="$(jq -r '[.backend,.frontend,.feishu_adapter] | map(select(. != "none")) | length' /tmp/prior-digests.json)"
          if [[ "$prior_count" -gt 0 ]]; then
            rollback_basis="prior_digests_preserved"
          else
            rollback_basis="first_deploy"
          fi
          jq -n --arg commit "${{ needs.candidate.outputs.sha }}" --arg backend "$backend" --arg frontend "$frontend" \
            --arg feishu_adapter "$feishu_adapter" \
            --argjson prior_digests "$prior_digests" --arg rollback_basis "$rollback_basis" \
            --arg migration "$migration" --arg health "$health" --arg rollback "$rollback" \
            '{version:2,status:"deployed",commit:$commit,
              images:{backend:$backend,frontend:$frontend,feishu_adapter:$feishu_adapter},
              prior_digests:$prior_digests,rollback_basis:$rollback_basis,
              migration_check:$migration,health_check:$health,rollback_check:$rollback}' \
            > tmp/deployment-evidence/deployment-receipt.json
          go run ./cmd/verification-schema \
            --schema .test/schemas/release-verification.schema.json \
            --input tmp/deployment-evidence/deployment-receipt.json

      - name: Attest deployment evidence
        id: attest-deployment
        uses: actions/attest@v4
        with: {subject-path: tmp/deployment-evidence/deployment-receipt.json}

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence
          path: |
            tmp/deployment-evidence/deployment-receipt.json
            ${{ steps.attest-deployment.outputs.bundle-path }}
          retention-days: 90
